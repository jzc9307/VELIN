name: macOS and Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check source and release metadata
        run: python3 scripts/release.py preflight
      - name: Run tests
        run: bash scripts/test.sh
      - name: Compile app without installing signing credentials
        run: bash scripts/build.sh --check
  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test and publish the Windows preview
        run: python scripts/build-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: VELIN-Windows-x64-preview
          path: dist/work/windows-x64.noindex/
